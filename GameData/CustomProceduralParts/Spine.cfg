// Adds the Spine shape to every ProceduralParts part (structural, tanks, avionics, ...).
@PART[*]:HAS[@MODULE[ProceduralPart],!MODULE[ProceduralShapeSpine]]:NEEDS[ProceduralParts]:AFTER[ProceduralParts]
{
	MODULE
	{
		name = ProceduralShapeSpine
		displayName = Spine
		length = 2.0
		hScale = 1.0
		vScale = 1.0

		// One key per line: KSP/MM config parsing doesn't split "a = 1 b = 2" on a single line.
		SPINE_NODE
		{
			position = 0.0
			sizeH = 1.25
			sizeV = 1.25
		}
		SPINE_NODE
		{
			position = 0.5
			sizeH = 1.80
			sizeV = 1.00
		}
		SPINE_NODE
		{
			position = 1.0
			sizeH = 0.80
			sizeV = 0.80
		}
	}
}

// The Spine "Airfoil" toggle drives a stock ModuleLiftingSurface (deflectionLiftCoeff set from the
// planform area in code; 0 = off). Add one to any procedural part that lacks it.
@PART[*]:HAS[@MODULE[ProceduralPart],!MODULE[ModuleLiftingSurface]]:NEEDS[ProceduralParts]:AFTER[ProceduralParts]
{
	MODULE
	{
		name = ModuleLiftingSurface
		deflectionLiftCoeff = 0.0
		dragAtMaxAoA = 0.6
		dragAtMinAoA = 0.0
	}
}
